<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraf Mahmud | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #0ea5e9;
            --accent-gradient: linear-gradient(135deg, #0ea5e9, #818cf8);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --ring-colors: conic-gradient(#0ea5e9, #22d3ee, #818cf8, #c084fc, #0ea5e9);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f1f5f9;
                --card-bg: #ffffff;
                --text-primary: #1e293b;
                --text-secondary: #64748b;
                --border-color: #e2e8f0;
                --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .profile-wrapper {
            position: relative;
            width: 148px;
            height: 148px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--ring-colors);
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-img {
            position: relative;
            width: 132px;
            height: 132px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-bg);
            z-index: 2;
        }

        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .verified {
            color: #1d9bf0;
            font-size: 18px;
        }

        .bio-container {
            font-size: 16px;
            font-weight: 500;
            color: var(--accent);
            height: 24px;
            margin-bottom: 24px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: var(--accent);
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .info-grid {
            text-align: left;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: capitalize;
        }

        .value {
            font-weight: 600;
            font-size: 14px;
        }

        .contact-trigger {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .contact-trigger:active {
            transform: scale(0.96);
        }

        .contact-menu {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 0;
        }

        .contact-menu.active {
            max-height: 400px;
            opacity: 1;
            margin-top: 16px;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .social-btn {
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .social-btn:active {
            opacity: 0.8;
        }

        .fb { background: #1877f2; grid-column: span 2; }
        .ms { background: #0084ff; }
        .wa { background: #25d366; }
        .tg { background: #0088cc; }
        .yt { background: #ff0000; }

        footer {
            margin-top: 24px;
            text-align: center;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 12px;
        }

        .footer-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 18px;
            color: var(--text-secondary);
        }

        .footer-icons a {
            color: inherit;
            transition: color 0.2s;
        }

        .footer-icons a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <div class="profile-wrapper">
                <div class="ring"></div>
                <img src="https://i.ibb.co/MyxWFcMg/1000005687.jpg" alt="Ashraf Mahmud" class="profile-img">
            </div>

            <div class="name-container">
                <h1 class="name">ASHRAF MAHMUD</h1>
                <span class="fa-stack verified">
                    <i class="fas fa-certificate fa-stack-2x"></i>
                    <i class="fas fa-check fa-stack-1x fa-inverse" style="font-size: 0.5em;"></i>
                </span>
            </div>

            <div class="bio-container">
                <span id="typing-text"></span><span class="cursor"></span>
            </div>

            <div class="info-grid">
                <div class="info-row">
                    <span class="label">Age</span>
                    <span class="value">19+</span>
                </div>
                <div class="info-row">
                    <span class="label">Gender</span>
                    <span class="value">male</span>
                </div>
                <div class="info-row">
                    <span class="label">Religion</span>
                    <span class="value">islam</span>
                </div>
                <div class="info-row">
                    <span class="label">Country</span>
                    <span class="value">Bangladesh</span>
                </div>
                <div class="info-row">
                    <span class="label">Address</span>
                    <span class="value">mawna Chowrasta. sreepur. Gazipur</span>
                </div>
            </div>

            <button class="contact-trigger" id="contactBtn">
                Contact Me <i class="fas fa-chevron-down" id="btnIcon"></i>
            </button>

            <div class="contact-menu" id="contactMenu">
                <div class="social-grid">
                    <a href="https://www.facebook.com/share/1EjvH4yPhM/" class="social-btn fb">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </a>
                    <a href="https://m.me/ibrahimkholil089" class="social-btn ms">
                        <i class="fab fa-facebook-messenger"></i> Messenger
                    </a>
                    <a href="https://wa.me/?text=Hey" class="social-btn wa">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                    <a href="https://t.me/FluentVibes9" class="social-btn tg">
                        <i class="fab fa-telegram-plane"></i> Telegram
                    </a>
                    <a href="https://www.youtube.com/@MdAshraf-z7w" class="social-btn yt">
                        <i class="fab fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>

        <footer>
            <p class="footer-text">&copy; 2026 Ashraf Mahmud. All rights reserved.</p>
            <div class="footer-icons">
                <a href="https://www.facebook.com/share/1EjvH4yPhM/"><i class="fab fa-facebook"></i></a>
                <a href="https://wa.me/?text=Hey"><i class="fab fa-whatsapp"></i></a>
                <a href="https://t.me/FluentVibes9"><i class="fab fa-telegram"></i></a>
                <a href="https://www.youtube.com/@MdAshraf-z7w"><i class="fab fa-youtube"></i></a>
            </div>
        </footer>
    </div>

    <script>
        // Typing Animation
        const text = "web developer";
        const typingElement = document.getElementById('typing-text');
        let i = 0;

        function type() {
            if (i < text.length) {
                typingElement.textContent += text.charAt(i);
                i++;
                setTimeout(type, 100);
            }
        }

        // Toggle Contact Menu
        const contactBtn = document.getElementById('contactBtn');
        const contactMenu = document.getElementById('contactMenu');
        const btnIcon = document.getElementById('btnIcon');

        contactBtn.addEventListener('click', () => {
            const isActive = contactMenu.classList.toggle('active');
            btnIcon.className = isActive ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
        });

        // Initialize
        window.onload = type;
    </script>
</body>
</html>
